<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Recipe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Delicious Pasta Recipe</h1>
    <img src="pasta.jpg" alt="Pasta Dish">

    <h2>Ingredients</h2>
    <ul class="ingredients">
      <li>200g spaghetti</li>
      <li>2 cloves garlic</li>
      <li>Olive oil</li>
      <li>Salt & pepper</li>
    </ul>

    <h2>Instructions</h2>
    <ol class="instructions">
      <li>Boil water and cook pasta.</li>
      <li>Sauté garlic in olive oil.</li>
      <li>Mix pasta with garlic and oil.</li>
      <li>Season and serve hot.</li>
    </ol>
  </div>
</body>
</html>
